<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ワードゲーム♡</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #ffe4f0,
          #f3e5ff,
          #e0f3ff
        );

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .container {

      width: 100%;

      max-width: 500px;

      background:
        rgba(255, 255, 255, 0.92);

      border-radius: 30px;

      padding: 35px 25px;

      text-align: center;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.12);

      border:
        3px solid
        rgba(255, 255, 255, 0.8);

    }


    /* タイトル */

    .title {

      margin: 0 0 10px;

      font-size: 28px;

      color: #ff6fa5;

      font-weight: bold;

      text-align: center;

    }


    /* 説明文 */

    .subtitle {

      margin-bottom: 25px;

      color: #777;

      font-size: 15px;

      text-align: center;

    }


    .heart {

      font-size: 18px;

    }


    /* 入力欄 */

    .input-area {

      width: 100%;

    }


    input {

      width: 100%;

      padding: 16px;

      border:
        2px solid
        #ffc1d9;

      border-radius: 18px;

      font-size: 16px;

      outline: none;

      background: #fff;

      text-align: left;

    }


    input:focus {

      border-color: #ff6fa5;

      box-shadow:
        0 0 0 3px
        rgba(255, 111, 165, 0.15);

    }


    /* 調べるボタン */

    button {

      width: 100%;

      margin-top: 15px;

      padding: 16px;

      border: none;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #ff8fba,
          #c99cff
        );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 5px 12px
        rgba(200, 130, 200, 0.25);

    }


    button:active {

      transform: scale(0.98);

    }


    /* 検索結果 */

    #result {

      width: 100%;

      margin-top: 28px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

    }


    /* 検索結果メッセージ */

    .result-text {

      width: 100%;

      margin: 0 0 15px;

      font-size: 22px;

      font-weight: bold;

      color: #555;

      text-align: center;

      line-height: 1.6;

    }


    /* 検索結果画像 */

    #result img {

      display: block;

      width: 100%;

      max-width: 350px;

      height: auto;

      margin: 0 auto;

      border-radius: 20px;

      box-shadow:
        0 6px 18px
        rgba(0, 0, 0, 0.12);

    }


    /* もう一度遊ぶボタン */

    .retry-button {

      width: 100%;

      margin-top: 20px;

      padding: 14px;

      border: 2px solid #ff9fc3;

      border-radius: 18px;

      background: white;

      color: #ff6fa5;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow: none;

    }


    .retry-button:active {

      transform: scale(0.98);

      background: #fff5f9;

    }


  </style>

</head>


<body>


  <div class="container">


    <!-- タイトル -->

    <h1 class="title">

      🎀 ワードゲーム 🎀

    </h1>


    <!-- 説明 -->

    <p class="subtitle">

      <span class="heart">♡</span>

      特定のワードを入力すると…

      <span class="heart">♡</span>

    </p>


    <!-- 入力エリア -->

    <div class="input-area">


      <input
        type="text"
        id="wordInput"
        placeholder="ここに入力してね♡"
      >


      <button
        onclick="checkWord()"
      >

        ワードを調べる ♡

      </button>


    </div>


    <!-- 結果表示 -->

    <div id="result"></div>


  </div>


  <script>


    function checkWord() {


      // 入力された文字を取得

      const input =
        document
          .getElementById("wordInput")
          .value;


      // 結果を表示する場所

      const result =
        document
          .getElementById("result");


      // 判定するワード

      const words = [


        {

          word: "ちんこ",

          image: "IMG_5889.jpeg",

          message: "男のシンボル"

        },


        {

          word: "ちんちん",

          image: "IMG_5890.jpeg",

          message: "みんな大好き"

        },


        {

          word: "ちんぽ",

          image: "IMG_5891.jpeg",

          message: "男子の股間からぶら下がっている"

        }


      ];


      // 最初に登場したワードを記録

      let firstMatch = null;

      let firstPosition = Infinity;


      // 3つのワードを確認

      for (
        const item of words
      ) {


        const position =
          input.indexOf(item.word);


        // ワードが含まれていた場合

        if (
          position !== -1 &&
          position < firstPosition
        ) {

          firstPosition =
            position;

          firstMatch =
            item;

        }

      }


      // 正解ワードがあった場合

      if (
        firstMatch !== null
      ) {


        result.innerHTML = `

          <div class="result-text">

            ${firstMatch.message}

          </div>


          <img
            src="${firstMatch.image}"
            alt="結果画像"
          >


          <button
            class="retry-button"
            onclick="resetGame()"
          >

            🔄 もう一度遊ぶ

          </button>

        `;


      }


      // 正解ワードがなかった場合

      else {


        result.innerHTML = `

          <div class="result-text">

            残念…

          </div>


          <img
            src="IMG_5892.jpeg"
            alt="ハズレ画像"
          >


          <button
            class="retry-button"
            onclick="resetGame()"
          >

            🔄 もう一度遊ぶ

          </button>

        `;

      }

    }


    // トップ画面に戻る

    function resetGame() {


      // 入力欄を空にする

      document
        .getElementById("wordInput")
        .value = "";


      // 結果を消す

      document
        .getElementById("result")
        .innerHTML = "";


      // ページの一番上へ移動

      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });


      // 入力欄にカーソルを戻す

      setTimeout(function() {

        document
          .getElementById("wordInput")
          .focus();

      }, 400);

    }


  </script>


</body>

</html>
